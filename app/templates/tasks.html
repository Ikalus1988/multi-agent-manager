{% extends 'base.html' %}
{% block content %}
<h1>Tasks</h1>
<div class="panel">
  <table>
    <thead><tr><th>Task</th><th>Status</th><th>Assigned Worker</th><th>Retry</th><th>Detail</th></tr></thead>
    <tbody>
    {% for task in tasks %}
      <tr>
        <td>{{ task.title }}<div class="muted">{{ task.task_id }}</div></td>
        <td>{{ task.status }}</td>
        <td>{{ task.assigned_worker_id or '-' }}</td>
        <td>{{ task.retry_count }}</td>
        <td><a class="inline" href="/tasks/{{ task.task_id }}">view</a></td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
