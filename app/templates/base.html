<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title or 'Multi Agent Manager' }}</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: #e5e7eb; }
    .topbar { display:flex; gap:16px; align-items:center; padding:16px 20px; background:#111827; border-bottom:1px solid #334155; }
    .topbar a { color:#93c5fd; text-decoration:none; }
    .topbar a:hover { text-decoration:underline; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .cards { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-bottom:20px; }
    .card, .panel { background:#111827; border:1px solid #334155; border-radius:12px; padding:16px; }
    table { width:100%; border-collapse: collapse; }
    th, td { border:1px solid #334155; padding:10px; text-align:left; vertical-align:top; }
    th { background:#1e293b; }
    .ok { color:#86efac; }
    .warn { color:#fcd34d; }
    .bad { color:#fca5a5; }
    .muted { color:#94a3b8; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { background:#2563eb; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; }
    input, textarea, select { width:100%; padding:8px; margin-top:6px; background:#0f172a; color:#e5e7eb; border:1px solid #334155; border-radius:8px; }
    label { display:block; margin-top:10px; }
    a.inline { color:#67e8f9; }
    .clip { max-width:520px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    code { color:#bae6fd; }
  </style>
</head>
<body>
  <div class="topbar">
    <strong>Multi Agent Manager</strong>
    <a href="/dashboard">Dashboard</a>
    <a href="/workers">Workers</a>
    <a href="/tasks">Tasks</a>
    <a href="/memory">Memory</a>
  </div>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
